<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doxy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div id="toast-container" class="toast-container"></div>

    <div class="sidebar">
        <div class="sidebar-top">
            <div class="logo">
                <img src="./media/images/Logo.png" alt="Doxy Logo" class="sidebar-logo-img">
                <span class="logo-text">Doxy</span>
            </div>
            
            <button class="close-sidebar-btn" onclick="toggleSidebar()" title="Close menu">
                <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>

            <button class="hamburger-btn" onclick="toggleSidebar()" title="Open menu">
                <svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
        </div>

        <button class="new-chat-btn" onclick="createNewChat()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            New Chat
        </button>

        <input type="file" id="file-input" accept=".pdf,.docx,.txt" onchange="handleFileUpload(event)" class="d-none">

        <div class="chat-sessions-list">
            <div class="document-list-title">History</div>
            <div id="sessions-container"></div>
        </div>

        <div class="document-list">
            <div class="document-list-title">Database</div>
            <div id="doc-container">
                <div id="empty-doc-msg" class="empty-doc-msg">
                    No document uploaded.
                </div>
            </div>
        </div>
    </div>
    
    <button class="mobile-hamburger-fixed" onclick="toggleSidebar()" title="Open menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>
    
    <div class="main-chat">
        <div class="top-right-chat-actions">
            <button class="top-icon-btn" onclick="toggleTheme()" id="theme-btn" title="Toggle Theme">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
            </button>

            <button class="top-icon-btn" onclick="createNewChat()" title="New Conversation">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            </button>
            
            <div class="top-menu-container">
                <button class="top-icon-btn" onclick="toggleTopMenu(event)" title="Conversation Options">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
                </button>
                
                <div id="top-dropdown-menu" class="session-menu-dropdown">
                    <button class="menu-item" onclick="topMenuPin()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15 8 22 9 17 14 18.5 21 12 17.5 5.5 21 7 14 2 9 9 8 12 2"></polygon></svg> Pin Conversation
                    </button>
                    <button class="menu-item" onclick="topMenuRename()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg> Rename
                    </button>
                    <button class="menu-item" onclick="exportCurrentChat()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg> Download / Export
                    </button>
                    <button class="menu-item delete-item" onclick="topMenuDelete()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg> Delete
                    </button>
                </div>
            </div>
        </div>
        
        <div class="chat-window" id="chat-window">
        </div>

        <div class="input-container">
            <div class="typing" id="typing-indicator">
                <span>Doxy is thinking</span>
                <span class="dots"><span>.</span><span>.</span><span>.</span></span>
            </div>            
            <div class="input-box">
                <button class="attach-btn" onclick="document.getElementById('file-input').click()" title="Upload Document">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                </button>

                <input type="text" id="user-input" placeholder="Ask a question..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
            <div class="disclaimer">
                The agent can make mistakes. Always verify the displayed sources.
            </div>
        </div>
    </div>
    
    <div id="custom-modal-overlay" class="modal-overlay">
        <div id="confirm-modal" class="custom-modal d-none">
            <div class="modal-header">Confirm Action</div>
            <div class="modal-body" id="confirm-message">Are you sure you want to do this?</div>
            <div class="modal-footer">
                <button class="modal-btn modal-cancel" onclick="closeCustomModal(false)">Cancel</button>
                <button class="modal-btn modal-submit modal-danger" onclick="closeCustomModal(true)">Yes, Delete</button>
            </div>
        </div>

        <div id="prompt-modal" class="custom-modal d-none">
            <div class="modal-header">Rename</div>
            <div class="modal-body" id="prompt-message">Enter text:</div>
            <input type="text" id="prompt-input" class="modal-input" placeholder="Type here...">
            <div class="modal-footer">
                <button class="modal-btn modal-cancel" onclick="closeCustomModal(null)">Cancel</button>
                <button class="modal-btn modal-submit" onclick="closeCustomModal(document.getElementById('prompt-input').value)">Save</button>
            </div>
        </div>
    </div>
    
    <script src="js/globals.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/modals.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/documents.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/sessions.js"></script>
</body>
</html>
